[package]
name = "xmip-core-resilience-rate-limit"
version.workspace = true
edition.workspace = true
license.workspace = true
repository = "https://github.com/IlleNilsson/xmip-core-resilience-rate-limit"
description = "Rate limit guard: a token bucket that refills one permit per interval up to a burst, and makes an attempt wait for its token rather than refusing it. A xmip-core-resilience technology."
publish.workspace = true

[lib]
path = "src/lib.rs"

[dependencies]
# A Technology depends on its parent Capability, never the reverse
# (repository-model.md).
resilience = { workspace = true }
# The lock taken whether or not a thread panicked under it, the failure a
# test hands the guard, and the Clock the bucket is refilled by.
xcore = { workspace = true }

[dev-dependencies]
# The one test clock, stepped to the next permit (`xcore::clock::Stepped`).
# Test-only.
xcore = { workspace = true, features = ["test-support"] }

[lints]
workspace = true
